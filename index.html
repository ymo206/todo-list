<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Keep track of school assignments and daily tasks.</p>

    <!-- Form for adding a new task -->
    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input
        type="text"
        id="task-input"
        placeholder="What do you need to do?"
        maxlength="200"
        autocomplete="off"
      >
      <button type="submit">Add</button>
    </form>

    <!-- Tasks are added here by script.js -->
    <ul id="task-list" class="task-list"></ul>

    <p id="empty-message" class="empty-message">No tasks yet. Add one above!</p>

    <p id="task-count" class="task-count"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
